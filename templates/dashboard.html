<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纳斯达克100动量对冲策略</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, 'Microsoft YaHei', sans-serif;
    background: #f5f7fa; color: #1a2332; padding: 28px 20px;
  }
  .container { max-width: 1360px; margin: 0 auto; }

  .header {
    background: linear-gradient(135deg, #1a2332 0%, #2a3a5c 100%);
    color: #fff; border-radius: 14px; padding: 24px 32px;
    margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end;
  }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .header .sub { font-size: 13px; color: #8899bb; margin-top: 4px; }
  .header .date { font-size: 14px; color: #aabbdd; }

  .summary-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px;
  }
  .summary-card {
    background: #fff; border-radius: 10px; padding: 16px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid #eef0f4;
  }
  .summary-card .label { font-size: 12px; color: #8899aa; margin-bottom: 8px; }
  .summary-card .value { font-size: 18px; font-weight: 700; }
  .summary-card .detail { font-size: 11px; color: #aabbcc; margin-top: 6px; line-height: 1.6; }
  .green { color: #27ae60; } .red { color: #e74c3c; } .blue { color: #2980b9; }

  .section-title {
    font-size: 16px; font-weight: 600; color: #1a2332; margin: 24px 0 12px;
  }

  .table-wrapper {
    background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    overflow-x: auto; border: 1px solid #eef0f4; margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f0f2f6; padding: 10px 10px; font-weight: 600; font-size: 12px;
    color: #4a5a7a; text-align: center; border-bottom: 2px solid #dce0e8; white-space: nowrap;
  }
  thead th:first-child { padding-left: 14px; }
  tbody td {
    padding: 8px 10px; text-align: center; border-bottom: 1px solid #f0f2f6;
    vertical-align: middle;
  }
  tbody td:first-child { padding-left: 14px; font-weight: 600; color: #4a5a7a; }
  tbody tr:hover { background: #f8faff; }
  tbody tr:last-child td { border-bottom: none; }

  .tag-add { background: #e8f5e9; color: #27ae60; padding: 2px 10px; border-radius: 3px; font-weight: 600; font-size: 12px; }
  .tag-remove { background: #fdecea; color: #e74c3c; padding: 2px 10px; border-radius: 3px; font-weight: 600; font-size: 12px; }
  .tag-keep { background: #e3f2fd; color: #1565c0; padding: 2px 10px; border-radius: 3px; font-weight: 600; font-size: 12px; }

  .up { color: #27ae60; font-weight: 600; }
  .down { color: #e74c3c; font-weight: 600; }

  .footer { text-align: center; margin-top: 16px; font-size: 12px; color: #99aabb; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  @media (max-width: 768px) {
    .summary-row { grid-template-columns: repeat(3, 1fr); }
    .two-col { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>
<div class="container">
<div class="header">
  <div>
    <h1>纳斯达克100动量对冲策略</h1>
    <div class="sub">K=5 动量选股 + PSQ 等名义对冲 · 周频调仓</div>
  </div>
  <div class="date" id="header-date">加载中...</div>
</div>

<div class="summary-row">
  <div class="summary-card">
    <div class="label">股票池</div>
    <div class="value blue" id="pool-size">-</div>
    <div class="detail">只</div>
  </div>
  <div class="summary-card">
    <div class="label">本周动量 Top5</div>
    <div class="detail" id="top5-detail" style="font-size:13px;line-height:1.8"></div>
  </div>
  <div class="summary-card">
    <div class="label">策略本周</div>
    <div class="value" id="strategy-w">-</div>
    <div class="detail">股票+PSQ对冲后</div>
  </div>
  <div class="summary-card">
    <div class="label">QQQ 本周</div>
    <div class="value" id="qqq-w">-</div>
    <div class="detail">基准对照</div>
  </div>
  <div class="summary-card">
    <div class="label">PSQ 本周</div>
    <div class="value" id="psq-w">-</div>
    <div class="detail">对冲端</div>
  </div>
</div>

<div class="two-col">
  <div>
    <div class="section-title">当前持仓</div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>排名</th><th>代码</th><th>20日动量</th><th>5日动量</th><th>现价</th><th>权重</th></tr></thead>
        <tbody id="holdings-tbody"><tr><td colspan="6" style="color:#999;">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div>
    <div class="section-title">调仓变动</div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>类型</th><th>代码</th><th>动量</th></tr></thead>
        <tbody id="changes-tbody"><tr><td colspan="3" style="color:#999;">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="section-title">历史回测（2021-2026 · 5.5年）</div>
<div class="table-wrapper">
  <table>
    <thead><tr><th>年份</th><th>策略收益</th><th>QQQ收益</th><th>超额</th></tr></thead>
    <tbody id="backtest-tbody"><tr><td colspan="4" style="color:#999;">加载中...</td></tr></tbody>
  </table>
</div>
<div class="summary-row" id="backtest-summary" style="margin-bottom:20px;"></div>

<div class="section-title">动量排名 Top30</div>
<div class="table-wrapper" style="max-height:500px;overflow-y:auto;">
  <table>
    <thead><tr><th>排名</th><th>代码</th><th>20日动量</th><th>现价</th></tr></thead>
    <tbody id="momentum-tbody"><tr><td colspan="4" style="color:#999;">加载中...</td></tr></tbody>
  </table>
</div>

<div class="footer">数据来源 Yahoo Finance + Backpack · 每小时自动刷新 · 纯研究参考，不构成投资建议</div>
</div>

<script>
const SNAP = __SNAP__;
const TOP_K = 5;

function fmt(num, d) { return typeof num==='number' ? num.toFixed(d||1) : (num||'-'); }
function cls(val) { return val>0?'up':(val<0?'down':''); }

(function render() {
  const d = SNAP;
  if (!d || d.error) { document.body.innerHTML = '<p style="text-align:center;padding:60px;color:#999;">数据加载中，请稍后刷新…</p>'; return; }

  document.getElementById('header-date').textContent = d.date || '-';
  document.getElementById('pool-size').textContent = d.pool_size || '-';

  // Top5 本周动量（按5日排序，独立于持仓）
  const top5 = d.week_top5 || d.momentum_top5 || [];
  document.getElementById('top5-detail').innerHTML = top5.map(m=>
    '<div><b>'+m.symbol+'</b> <span class="'+(m.momentum_5d>0?'up':'down')+'">'+fmt(m.momentum_5d)+'%</span></div>'
  ).join('');

  // Strategy week
  const strat = d.performance?.strategy_w;
  const elStrat = document.getElementById('strategy-w');
  elStrat.textContent = (strat!=null ? (strat>0?'+':'')+fmt(strat)+'%' : '-');
  elStrat.className = 'value ' + (strat>0?'green':(strat<0?'red':''));

  const qqqW = d.performance?.qqq_w;
  const elQqq = document.getElementById('qqq-w');
  elQqq.textContent = (qqqW!=null ? (qqqW>0?'+':'')+fmt(qqqW)+'%' : '-');
  elQqq.className = 'value ' + (qqqW>0?'green':(qqqW<0?'red':''));

  const psqW = d.performance?.psq_w;
  const elPsq = document.getElementById('psq-w');
  elPsq.textContent = (psqW!=null ? (psqW>0?'+':'')+fmt(psqW)+'%' : '-');
  elPsq.className = 'value ' + (psqW>0?'green':(psqW<0?'red':''));

  // Holdings table
  const h = d.all_holdings || top5;
  document.getElementById('holdings-tbody').innerHTML = h.map((m,i)=>
    '<tr><td>'+(i+1)+'</td><td><b>'+m.symbol+'</b></td>'+
    '<td class="'+(m.momentum>0?'up':'down')+'">'+fmt(m.momentum)+'%</td>'+
    '<td class="'+(m.momentum_5d>0?'up':(m.momentum_5d<0?'down':''))+'">'+(m.momentum_5d!=null?fmt(m.momentum_5d)+'%':'-')+'</td>'+
    '<td>'+fmt(m.price,2)+'</td><td>'+fmt(100/TOP_K||20,0)+'%</td></tr>'
  ).join('') || '<tr><td colspan="6" style="color:#999;">无数据</td></tr>';

  // Changes table — 只有新增或剔除时才逐条列，否则显示"无变化"
  const ch = d.changes || {};
  let changeRows = '';
  (ch.added||[]).forEach(c=>{ changeRows += '<tr><td><span class="tag-add">新增</span></td><td><b>'+c.symbol+'</b></td><td class="up">'+fmt(c.momentum)+'%</td></tr>'; });
  (ch.removed||[]).forEach(c=>{ changeRows += '<tr><td><span class="tag-remove">剔除</span></td><td><b>'+c+'</b></td><td>-</td></tr>'; });
  if ((ch.added||[]).length > 0 || (ch.removed||[]).length > 0) {
    (ch.kept||[]).forEach(c=>{ changeRows += '<tr><td><span class="tag-keep">持有</span></td><td><b>'+c+'</b></td><td>-</td></tr>'; });
  }
  document.getElementById('changes-tbody').innerHTML = changeRows || '<tr><td colspan="3" style="color:#999;">持仓无变化</td></tr>';

  // Backtest display
  const bt = d.backtest;
  if (bt) {
    let btRows = '';
    (bt.yearly||[]).forEach(y => {
      const alpha = y.strategy - y.qqq;
      btRows += '<tr><td><b>'+y.year+'</b></td>'+
        '<td class="'+(y.strategy>0?'up':'down')+'">'+(y.strategy>0?'+':'')+fmt(y.strategy)+'%</td>'+
        '<td class="'+(y.qqq>0?'up':'down')+'">'+(y.qqq>0?'+':'')+fmt(y.qqq)+'%</td>'+
        '<td class="'+(alpha>0?'up':'down')+'">'+(alpha>0?'+':'')+fmt(alpha)+'%</td></tr>';
    });
    document.getElementById('backtest-tbody').innerHTML = btRows;
    const cagr = ((bt.final_value||58951)/10000)**(1/5.5)-1;
    document.getElementById('backtest-summary').innerHTML =
      '<div class="summary-card"><div class="label">5.5年总收益</div><div class="value '+(bt.total_return>0?'green':'red')+'">'+(bt.total_return>0?'+':'')+bt.total_return+'%</div><div class="detail">年化CAGR '+fmt(cagr*100,1)+'%</div></div>'+
      '<div class="summary-card"><div class="label">QQQ总收益</div><div class="value '+(bt.qqq_return>0?'green':'red')+'">'+(bt.qqq_return>0?'+':'')+bt.qqq_return+'%</div><div class="detail">年化CAGR '+fmt((((bt.qqq_final_value||21683)/10000)**(1/5.5)-1)*100,1)+'%</div></div>'+
      '<div class="summary-card"><div class="label">策略夏普</div><div class="value blue">'+bt.sharpe+'</div></div>'+
      '<div class="summary-card"><div class="label">QQQ夏普</div><div class="value blue">'+bt.qqq_sharpe+'</div></div>'+
      '<div class="summary-card"><div class="label">最大回撤</div><div class="value red">'+bt.max_drawdown+'%</div><div class="detail">QQQ '+bt.qqq_max_drawdown+'%</div></div>'+
      '<div class="summary-card"><div class="label">终值($1万起)</div><div class="value blue">$'+(bt.final_value||58951).toLocaleString()+'</div><div class="detail">QQQ $'+(bt.qqq_final_value||21683).toLocaleString()+'</div></div>';
  }

  // Momentum full list
  const full = d.full_momentum || [];
  document.getElementById('momentum-tbody').innerHTML = full.map(m=>
    '<tr><td>'+m.rank+'</td><td><b>'+m.symbol+'</b></td>'+
    '<td class="'+(m.momentum>0?'up':'down')+'">'+fmt(m.momentum)+'%</td>'+
    '<td>'+fmt(m.price,2)+'</td></tr>'
  ).join('') || '<tr><td colspan="4" style="color:#999;">无数据</td></tr>';

})();
</script>
</body>
</html>
